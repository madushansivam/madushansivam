<svg viewBox="0 0 1000 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .node { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #e6edf3; font-weight: 700; }
      .stage { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #8b949e; }
    </style>
  </defs>

  <rect width="1000" height="160" fill="#0d1117"/>

  <!-- base connecting line -->
  <line x1="90" y1="80" x2="910" y2="80" stroke="#30363d" stroke-width="3"/>

  <!-- animated flowing dashes over the line -->
  <line x1="90" y1="80" x2="910" y2="80" stroke="#f0883e" stroke-width="3" stroke-dasharray="12 18">
    <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="1.6s" repeatCount="indefinite"/>
  </line>

  <!-- SOURCE -->
  <g>
    <circle cx="90" cy="80" r="26" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <text x="90" y="85" text-anchor="middle" class="node">SRC</text>
    <text x="90" y="128" text-anchor="middle" class="stage">source</text>
  </g>

  <!-- BUILD -->
  <g>
    <circle cx="295" cy="80" r="26" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <text x="295" y="85" text-anchor="middle" class="node">BLD</text>
    <text x="295" y="128" text-anchor="middle" class="stage">build</text>
  </g>

  <!-- TEST -->
  <g>
    <circle cx="500" cy="80" r="26" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <text x="500" y="85" text-anchor="middle" class="node">TST</text>
    <text x="500" y="128" text-anchor="middle" class="stage">test</text>
  </g>

  <!-- DEPLOY -->
  <g>
    <circle cx="705" cy="80" r="26" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <text x="705" y="85" text-anchor="middle" class="node">DPL</text>
    <text x="705" y="128" text-anchor="middle" class="stage">deploy</text>
  </g>

  <!-- LIVE (green, pulsing) -->
  <g>
    <circle cx="910" cy="80" r="26" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="910" y="85" text-anchor="middle" class="node">LIVE</text>
    <text x="910" y="128" text-anchor="middle" class="stage">production</text>
  </g>
  <circle cx="910" cy="80" r="26" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.6">
    <animate attributeName="r" from="26" to="42" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.6" to="0" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
