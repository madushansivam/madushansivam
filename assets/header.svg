<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="50%" stop-color="#1a1006"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="amberText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffcc8a"/>
      <stop offset="100%" stop-color="#f0883e"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- ================= circuit-board background ================= -->
  <g opacity="0.22" stroke="#f0883e" stroke-width="1.5" fill="none">
    <path id="trace1" d="M -20 240 L 160 240 L 160 190 L 340 190 L 340 260 L 560 260"/>
    <path id="trace2" d="M 1220 40 L 1010 40 L 1010 95 L 830 95 L 830 30 L 620 30"/>
    <path id="trace3" d="M -20 60 L 120 60 L 120 20 L 260 20"/>
    <circle cx="160" cy="240" r="3" fill="#f0883e" stroke="none"/>
    <circle cx="340" cy="190" r="3" fill="#f0883e" stroke="none"/>
    <circle cx="1010" cy="40" r="3" fill="#f0883e" stroke="none"/>
    <circle cx="830" cy="95" r="3" fill="#f0883e" stroke="none"/>
  </g>

  <circle r="3.5" fill="#ffcc8a" filter="url(#softGlow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#trace1"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#ffa657" filter="url(#softGlow)">
    <animateMotion dur="2.6s" repeatCount="indefinite" begin="0.8s">
      <mpath href="#trace2"/>
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#ffcc8a" filter="url(#softGlow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" begin="1.3s">
      <mpath href="#trace3"/>
    </animateMotion>
  </circle>

  <!-- ================= terminal chrome ================= -->
  <rect x="0" y="0" width="1200" height="34" fill="#12151b" opacity="0.95"/>
  <circle cx="24" cy="17" r="6" fill="#f0883e"/>
  <circle cx="46" cy="17" r="6" fill="#3fb950" opacity="0.55"/>
  <circle cx="68" cy="17" r="6" fill="#58a6ff" opacity="0.55"/>
  <text x="600" y="22" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#8b949e">madushan@fedora:~$</text>

  <!-- ================= boot sequence log ================= -->
  <g font-family="JetBrains Mono, monospace" font-size="12.5" fill="#6e7681">
    <text x="50" y="58" opacity="0"><tspan fill="#3fb950">[ OK ]</tspan> Booting fedora-linux kernel...
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.1s" fill="freeze"/>
    </text>
    <text x="50" y="76" opacity="0"><tspan fill="#3fb950">[ OK ]</tspan> Mounting /home/madushan/projects
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/>
    </text>
    <text x="50" y="94" opacity="0"><tspan fill="#3fb950">[ OK ]</tspan> Starting devops.service
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/>
    </text>
    <text x="50" y="112" opacity="0"><tspan fill="#3fb950">[ OK ]</tspan> Starting nanmin-studio.service
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.3s" fill="freeze"/>
    </text>
  </g>

  <text x="50" y="150" font-family="JetBrains Mono, monospace" font-size="19" fill="#3fb950" opacity="0">
    $ whoami
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.7s" fill="freeze"/>
  </text>

  <g filter="url(#glow)">
    <text x="50" y="205" font-family="JetBrains Mono, monospace" font-weight="700" font-size="42" fill="url(#amberText)">Madushan Samayasivam</text>
  </g>
  <rect x="45" y="171" width="640" height="44" fill="#0a0d12">
    <animate attributeName="width" from="640" to="0" dur="1.7s" begin="2.0s" fill="freeze"/>
  </rect>

  <rect x="680" y="177" width="11" height="34" fill="#ffcc8a" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="3.7s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3.8s" repeatCount="indefinite"/>
  </rect>

  <text x="50" y="240" font-family="JetBrains Mono, monospace" font-size="16" fill="#8b949e" opacity="0">
    DevOps Engineer &#183; CI/CD &#183; Cloud &#183; Containers
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="4.0s" fill="freeze"/>
  </text>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="4.4s" fill="freeze"/>
    <circle cx="1080" cy="238" r="5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="1095" y="243" font-family="JetBrains Mono, monospace" font-size="12" fill="#8b949e">STATUS: ONLINE</text>
  </g>
</svg>
